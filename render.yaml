services:
  - type: web
    name: rinbam-media-resolver
    env: python
    plan: free
    buildCommand: DENO_INSTALL=$PWD/.deno curl -fsSL https://deno.land/install.sh | sh && pip install --upgrade -r requirements-media-resolver.txt
    startCommand: PATH=$PWD/.deno/bin:$PATH python3 scripts/media_resolver_backend.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MEDIA_RESOLVER_CACHE_DIR
        value: /tmp/rinbam-media-cache
      - key: MEDIA_RESOLVER_YOUTUBE_CLI_TIMEOUT_SECONDS
        value: "55"
      # MEDIA_RESOLVER_YOUTUBE_DELEGATE_URL is intentionally unset: the resolver
      # attempts public-YouTube resolution on this host via the Innertube
      # fallback. Production GO still requires a live smoke from Render. If that
      # smoke fails, delegate only to a production-proven Railway Free instance.
