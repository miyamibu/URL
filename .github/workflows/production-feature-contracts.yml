name: Production feature contracts

on:
  push:
    branches:
      - main
    paths:
      - "web/admin/**"
      - "supabase/functions/store-notification-receiver/**"
      - "supabase/functions/store-entitlement-reconciliation/**"
      - "supabase/functions/verify-store-purchase/**"
      - "supabase/functions/_shared/store-notification-contract.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify_mcp_contract.py"
      - "scripts/test_verify_admin_e2e.py"
      - "scripts/verify_admin_e2e.py"
      - "scripts/smoke_mcp_staging.sh"
      - "docs/ai/mcp-*.md"
      - "docs/release/*"
  pull_request:
    paths:
      - "web/admin/**"
      - "supabase/functions/store-notification-receiver/**"
      - "supabase/functions/store-entitlement-reconciliation/**"
      - "supabase/functions/verify-store-purchase/**"
      - "supabase/functions/_shared/store-notification-contract.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify_mcp_contract.py"
      - "scripts/test_verify_admin_e2e.py"
      - "scripts/verify_admin_e2e.py"
      - "scripts/smoke_mcp_staging.sh"
      - "docs/ai/mcp-*.md"
      - "docs/release/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-feature-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-admin:
    name: Web Admin typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  store-deno:
    name: Store Deno contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.1"

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Typecheck
        run: |
          find supabase/functions -type f -name 'index.ts' | sort | while IFS= read -r source; do
            deno check "$source"
          done

      - name: All Deno tests
        run: bash scripts/run_deno_tests.sh

  contract-tests:
    name: MCP and Admin contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Verify MCP static contract
        run: python3 scripts/verify_mcp_contract.py

      - name: Verify Admin E2E runner fail-closed behavior
        run: python3 -m unittest scripts/test_verify_admin_e2e.py
