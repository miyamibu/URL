name: Contact support health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public contact-support health
        env:
          CONTACT_SUPPORT_HEALTH_URL: https://xocumgxbylmpoobfqows.supabase.co/functions/v1/contact-support
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 20 --retry 2 --retry-delay 2 "$CONTACT_SUPPORT_HEALTH_URL")"
          printf '%s\n' "$response" | jq -e '.status == "ok" and .service == "contact-support"' >/dev/null
