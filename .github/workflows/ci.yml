name: Cross-platform CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: cross-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug and release validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release manifest
        run: python3 scripts/verify_release_manifest.py

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint debug
        run: ./gradlew lintDebug

      - name: Assemble release
        run: ./gradlew assembleRelease

      # Never invoke connectedAndroidTest here. The Gradle guard protects
      # physical-device data, and CI uses JVM tests plus release compilation.

  ios:
    name: iOS app, tests, and Share Extension
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify release manifest
        run: python3 scripts/verify_release_manifest.py

      - name: Build iOS app without signing
        run: >-
          xcodebuild
          -project ios/URLSaveriOS.xcodeproj
          -scheme URLSaveriOS
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/URLSaverDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Compile Share Extension without signing
        run: >-
          xcodebuild
          -project ios/URLSaveriOS.xcodeproj
          -scheme URLSaverShareExtension
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/URLSaverShareExtensionDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Run iOS tests on simulator
        run: >-
          xcodebuild
          -project ios/URLSaveriOS.xcodeproj
          -scheme URLSaveriOS
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -derivedDataPath "$RUNNER_TEMP/URLSaverTestsDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test

  deno:
    name: All Supabase Deno tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.1"

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Typecheck all functions
        run: |
          find supabase/functions -type f -name 'index.ts' | sort | while IFS= read -r source; do
            deno check "$source"
          done

      - name: Run all Deno tests
        run: bash scripts/run_deno_tests.sh

  python:
    name: Python resolver and release-script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run Python tests
        run: >-
          python3 -m unittest
          tests/test_media_resolver_backend.py
          scripts/test_verify_admin_e2e.py
          scripts/test_verify_release_manifest.py

      - name: Verify release hygiene
        run: bash scripts/check_release_hygiene.sh

  supabase:
    name: Local Supabase migrations, SQL/RLS, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      URLSAVER_SUPABASE_LINKED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.104.0

      - name: Run isolated local SQL validation
        run: bash scripts/verify_supabase_local.sh
