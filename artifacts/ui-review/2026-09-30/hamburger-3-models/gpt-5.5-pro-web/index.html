<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>りんばむ ハンバーガーメニュー案 3 / GPT-5.5 Pro Web</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ed;
      --paper: #fffdf8;
      --paper-2: #fbf6ec;
      --ink: #241f18;
      --muted: #766d62;
      --line: rgba(54, 45, 32, 0.13);
      --line-strong: rgba(54, 45, 32, 0.22);
      --accent: #8f5f28;
      --accent-2: #ba7a33;
      --green: #516f54;
      --shadow: 0 18px 52px rgba(49, 38, 24, 0.20);
      --soft-shadow: 0 10px 26px rgba(49, 38, 24, 0.12);
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #e8e1d6;
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: start center;
      padding: 0;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 8%, rgba(255, 255, 255, 0.95) 0 9%, transparent 28%),
        linear-gradient(180deg, #faf7f0 0%, #f2ebdf 62%, #ebe1d3 100%);
      isolation: isolate;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: -90px -80px auto auto;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: rgba(186, 122, 51, 0.13);
      filter: blur(4px);
      pointer-events: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 18px 92px;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      margin-bottom: 12px;
    }

    .brand {
      flex: 1 1 auto;
      min-width: 0;
    }

    .brand-label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      line-height: 1.2;
    }

    .brand-title {
      display: block;
      margin-top: 3px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      position: relative;
      z-index: 8;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255, 253, 248, 0.82);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 18px rgba(49, 38, 24, 0.09);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .icon-button:active { transform: scale(0.96); }
    .icon-button:focus-visible { outline: 3px solid rgba(143, 95, 40, 0.34); outline-offset: 2px; }

    .hamburger-lines {
      width: 18px;
      height: 14px;
      position: relative;
      display: block;
    }

    .hamburger-lines::before,
    .hamburger-lines::after,
    .hamburger-lines span {
      content: "";
      position: absolute;
      right: 0;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transition: transform 170ms ease, width 170ms ease, top 170ms ease, opacity 170ms ease;
    }

    .hamburger-lines::before { top: 0; width: 18px; }
    .hamburger-lines span { top: 6px; width: 13px; }
    .hamburger-lines::after { top: 12px; width: 18px; }

    .menu-open .hamburger-lines::before { top: 6px; transform: rotate(45deg); }
    .menu-open .hamburger-lines span { opacity: 0; width: 0; }
    .menu-open .hamburger-lines::after { top: 6px; transform: rotate(-45deg); }

    .search-icon {
      width: 18px;
      height: 18px;
      border: 2px solid currentColor;
      border-radius: 999px;
      position: relative;
      display: block;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: rotate(45deg);
      right: -5px;
      bottom: -2px;
    }

    .quick-row {
      display: flex;
      gap: 8px;
      overflow: hidden;
      margin: 2px 0 14px;
      padding-bottom: 1px;
    }

    .chip {
      flex: 0 0 auto;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.76);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(49, 38, 24, 0.06);
    }

    .chip.is-active {
      background: var(--ink);
      color: #fffdf8;
      border-color: transparent;
    }

    .cards {
      display: grid;
      gap: 12px;
      overflow: hidden;
      padding-bottom: 6px;
    }

    .card {
      position: relative;
      border-radius: 24px;
      background: rgba(255, 253, 248, 0.86);
      border: 1px solid var(--line);
      box-shadow: var(--soft-shadow);
      padding: 16px;
      min-height: 128px;
    }

    .card:first-child {
      min-height: 156px;
      background: linear-gradient(135deg, rgba(255, 253, 248, 0.96), rgba(244, 232, 214, 0.90));
    }

    .card-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .service {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(81, 111, 84, 0.12);
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.42;
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    .card-url {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .tagline {
      display: flex;
      gap: 7px;
      margin-top: 14px;
    }

    .tag {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(143, 95, 40, 0.12);
      color: #654117;
      font-size: 11px;
      font-weight: 800;
    }

    .ai-action {
      position: absolute;
      right: 18px;
      bottom: 104px;
      z-index: 5;
      height: 42px;
      padding: 0 15px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #2c281f;
      color: #fffaf0;
      box-shadow: 0 16px 30px rgba(49, 38, 24, 0.24);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.01em;
    }

    .ai-action::before {
      content: "✦";
      font-size: 14px;
      color: #ffd99d;
    }

    .bottom-nav {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      z-index: 6;
      height: 72px;
      border-radius: 26px;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(54, 45, 32, 0.16);
      box-shadow: 0 18px 46px rgba(49, 38, 24, 0.20);
      display: grid;
      grid-template-columns: 1fr 1fr 70px 1fr 1fr;
      align-items: center;
      padding: 8px 8px 9px;
    }

    .nav-item {
      display: grid;
      place-items: center;
      gap: 4px;
      min-width: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
    }

    .nav-icon {
      width: 23px;
      height: 23px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-size: 15px;
    }

    .add-button {
      width: 58px;
      height: 58px;
      margin: -20px auto 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #a66d2e, #754b20);
      color: white;
      font-size: 28px;
      line-height: 1;
      box-shadow: 0 14px 26px rgba(117, 75, 32, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .backdrop {
      position: absolute;
      inset: 72px 0 0;
      z-index: 3;
      background: rgba(36, 31, 24, 0.14);
      opacity: 0;
      pointer-events: none;
      transition: opacity 190ms ease;
    }

    .menu-open .backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: absolute;
      top: 82px;
      right: 12px;
      z-index: 7;
      width: 284px;
      max-width: calc(100% - 28px);
      border-radius: 30px;
      background: linear-gradient(180deg, #fffdf8, #faf2e6);
      border: 1px solid rgba(54, 45, 32, 0.17);
      box-shadow: var(--shadow);
      padding: 14px;
      transform: translateX(22px) scale(0.98);
      opacity: 0;
      pointer-events: none;
      transition: transform 220ms cubic-bezier(.2,.9,.2,1), opacity 160ms ease;
    }

    .menu-open .side-menu {
      transform: translateX(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .menu-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 6px 7px 12px;
      border-bottom: 1px solid var(--line);
    }

    .menu-eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.10em;
    }

    .menu-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .mode-badge {
      flex: 0 0 auto;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(81, 111, 84, 0.12);
      color: #405a43;
      font-size: 11px;
      font-weight: 900;
    }

    .menu-list {
      display: grid;
      gap: 7px;
      padding: 12px 0 8px;
      margin: 0;
      list-style: none;
    }

    .menu-item {
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      background: transparent;
      color: var(--ink);
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 8px 8px;
      text-align: left;
      transition: background 150ms ease, transform 150ms ease;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      background: rgba(143, 95, 40, 0.09);
      outline: none;
    }

    .menu-item:active { transform: scale(0.985); }

    .menu-mark {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(143, 95, 40, 0.11);
      color: #704818;
      font-size: 17px;
      font-weight: 900;
    }

    .menu-copy {
      min-width: 0;
    }

    .menu-label {
      display: block;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 900;
    }

    .menu-note {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.2;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      color: rgba(36, 31, 24, 0.38);
      font-size: 19px;
      line-height: 1;
    }

    .menu-status {
      min-height: 34px;
      margin: 2px 2px 0;
      padding: 9px 11px;
      border-radius: 15px;
      background: rgba(36, 31, 24, 0.06);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app menu-open" id="app" aria-label="りんばむ ホーム画面プロトタイプ" data-menu-open="true">
    <div class="screen" aria-hidden="false">
      <header class="topbar">
        <div class="brand" aria-label="りんばむ">
          <span class="brand-label">URL SAVER</span>
          <span class="brand-title">りんばむ</span>
        </div>
        <div class="top-actions">
          <button class="icon-button" type="button" aria-label="検索" id="searchButton">
            <span class="search-icon" aria-hidden="true"></span>
          </button>
          <button class="icon-button" type="button" aria-label="メニューを閉じる" aria-expanded="true" aria-controls="sideMenu" id="menuButton">
            <span class="hamburger-lines" aria-hidden="true"><span></span></span>
          </button>
        </div>
      </header>

      <section class="quick-row" aria-label="フィルター">
        <span class="chip is-active">すべて</span>
        <span class="chip">YouTube</span>
        <span class="chip">X</span>
        <span class="chip">レシピ</span>
        <span class="chip">あとで読む</span>
      </section>

      <section class="cards" aria-label="保存したURLのダミーカード">
        <article class="card">
          <div class="card-kicker"><span class="service"><span class="dot"></span>ACTIVE</span><span>ダミー</span></div>
          <h2 class="card-title">夜に見返したいデザイン参考リンクを保存しました</h2>
          <p class="card-url">example.com/design/reference-note</p>
          <div class="tagline"><span class="tag">デザイン</span><span class="tag">あとで見る</span></div>
        </article>
        <article class="card">
          <div class="card-kicker"><span class="service"><span class="dot"></span>Web</span><span>今日</span></div>
          <h2 class="card-title">共有から入れたURLのメモを確認</h2>
          <p class="card-url">sample.invalid/saved-url-card</p>
        </article>
        <article class="card">
          <div class="card-kicker"><span class="service"><span class="dot"></span>Archive ready</span><span>昨日</span></div>
          <h2 class="card-title">読み終わったリンクはアーカイブへ</h2>
          <p class="card-url">demo.example/archive-flow</p>
        </article>
      </section>
    </div>

    <button class="ai-action" type="button" id="aiButton" aria-label="AIに送る 独立導線">AI</button>

    <div class="backdrop" id="backdrop" aria-hidden="true"></div>

    <aside class="side-menu" id="sideMenu" aria-label="ホームメニュー">
      <div class="menu-head">
        <div>
          <p class="menu-eyebrow">MENU</p>
          <h1 class="menu-title">保存リンクの操作</h1>
        </div>
        <span class="mode-badge">画像つき</span>
      </div>

      <ul class="menu-list">
        <li>
          <button class="menu-item" type="button" data-action="プロフィール" aria-label="プロフィール">
            <span class="menu-mark" aria-hidden="true">人</span>
            <span class="menu-copy"><span class="menu-label">プロフィール</span><span class="menu-note">同期や設定の状態を見る</span></span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>
        </li>
        <li>
          <button class="menu-item" type="button" data-action="画像なし表示に切り替える" aria-label="画像なし表示に切り替える">
            <span class="menu-mark" aria-hidden="true">画</span>
            <span class="menu-copy"><span class="menu-label">画像なし表示に切り替える</span><span class="menu-note">カードを軽く表示する</span></span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>
        </li>
        <li>
          <button class="menu-item" type="button" data-action="選択" aria-label="選択">
            <span class="menu-mark" aria-hidden="true">選</span>
            <span class="menu-copy"><span class="menu-label">選択</span><span class="menu-note">複数のリンクを選ぶ</span></span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>
        </li>
        <li>
          <button class="menu-item" type="button" data-action="使い方" aria-label="使い方">
            <span class="menu-mark" aria-hidden="true">本</span>
            <span class="menu-copy"><span class="menu-label">使い方</span><span class="menu-note">説明一覧を開く想定</span></span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>
        </li>
        <li>
          <button class="menu-item" type="button" data-action="データの取り扱い" aria-label="データの取り扱い">
            <span class="menu-mark" aria-hidden="true">守</span>
            <span class="menu-copy"><span class="menu-label">データの取り扱い</span><span class="menu-note">保存内容と扱いを確認</span></span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>
        </li>
      </ul>

      <p class="menu-status" id="menuStatus" aria-live="polite">プロトタイプです。項目を押すとここに反応だけ表示します。</p>
    </aside>

    <nav class="bottom-nav" aria-label="下部アクション">
      <button class="nav-item" type="button" aria-label="グループ"><span class="nav-icon" aria-hidden="true">◎</span><span>グループ</span></button>
      <button class="nav-item" type="button" aria-label="エクスポート"><span class="nav-icon" aria-hidden="true">⇧</span><span>エクスポート</span></button>
      <button class="add-button" type="button" aria-label="追加">＋</button>
      <button class="nav-item" type="button" aria-label="タグ"><span class="nav-icon" aria-hidden="true">#</span><span>タグ</span></button>
      <button class="nav-item" type="button" aria-label="アーカイブ"><span class="nav-icon" aria-hidden="true">□</span><span>アーカイブ</span></button>
    </nav>
  </main>

  <script>
    const app = document.getElementById('app');
    const menuButton = document.getElementById('menuButton');
    const backdrop = document.getElementById('backdrop');
    const menuStatus = document.getElementById('menuStatus');
    const sideMenu = document.getElementById('sideMenu');
    const searchButton = document.getElementById('searchButton');
    const aiButton = document.getElementById('aiButton');

    function setMenu(open) {
      app.classList.toggle('menu-open', open);
      app.dataset.menuOpen = String(open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'メニューを閉じる' : 'メニューを開く');
    }

    menuButton.addEventListener('click', () => {
      setMenu(!app.classList.contains('menu-open'));
    });

    backdrop.addEventListener('click', () => {
      setMenu(false);
      menuStatus.textContent = '外側をクリックしたのでメニューを閉じました。';
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && app.classList.contains('menu-open')) {
        setMenu(false);
        menuStatus.textContent = 'Escapeでメニューを閉じました。';
        menuButton.focus();
      }
    });

    sideMenu.addEventListener('click', (event) => {
      const item = event.target.closest('[data-action]');
      if (!item) return;
      const action = item.dataset.action;
      menuStatus.textContent = `「${action}」を押しました。実アプリ機能は動かさないプロトタイプ反応です。`;
    });

    searchButton.addEventListener('click', () => {
      menuStatus.textContent = '検索はメニュー外の上部アクションとして残しています。';
    });

    aiButton.addEventListener('click', () => {
      menuStatus.textContent = 'AIはメニュー内にも下部6番目にも入れない独立導線です。';
    });
  </script>
</body>
</html>
