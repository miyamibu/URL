<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>りんばむ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; background: #e0e0e0; display: flex; justify-content: flex-start; align-items: flex-start; min-height: 844px; }
  .app { width: 390px; height: 844px; background: #fff; position: relative; overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  header { height: 56px; background: #1a1a2e; color: #fff; display: flex; align-items: center; gap: 8px; padding: 0 10px; flex-shrink: 0; position: relative; z-index: 20; }
  .menu-btn { width: 44px; height: 44px; border: none; background: transparent; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; }
  .menu-btn span { display: block; width: 20px; height: 2px; background: #fff; border-radius: 1px; }
  .title { margin-right: auto; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }
  .search-box { width: 110px; position: relative; }
  .search-box input { width: 100%; height: 38px; border-radius: 19px; border: none; padding: 0 10px; background: rgba(255,255,255,0.12); color: #fff; font-size: 12px; outline: none; }
  .search-box input::placeholder { color: rgba(255,255,255,0.55); }
  main { flex: 1; overflow-y: auto; padding: 16px; background: #f4f4f6; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .card-img { width: 100%; height: 130px; background: linear-gradient(135deg, #e2e2e2, #c8c8c8); border-radius: 10px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; letter-spacing: 0.05em; }
  .card h3 { font-size: 15px; margin-bottom: 6px; color: #222; }
  .card p { font-size: 13px; color: #666; line-height: 1.55; }
  nav.bottom { height: 64px; background: #fff; border-top: 1px solid #e6e6e6; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 20; }
  nav.bottom a { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #999; font-size: 10px; gap: 3px; }
  nav.bottom a.active { color: #1a1a2e; font-weight: 700; }
  nav.bottom a.active .nav-icon { width: 52px; height: 52px; margin-top: -28px; border-radius: 50%; background: #1a1a2e; color: white; font-size: 30px; border: 4px solid white; }
  .nav-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; }
  .ai { position: absolute; right: 16px; bottom: 78px; z-index: 18; border: 0; border-radius: 20px; padding: 9px 15px; background: #1a1a2e; color: white; font-weight: 700; }
  .menu-overlay { position: absolute; inset: 56px 0 0; background: rgba(10,10,20,0.45); z-index: 200; display: flex; opacity: 1; transition: opacity 0.25s ease; }
  .menu-overlay.hidden { opacity: 0; pointer-events: none; }
  .menu-panel { width: 270px; height: 100%; margin-left: auto; background: #1a1a2e; color: #fff; padding: 32px 28px 28px; box-shadow: -6px 0 24px rgba(0,0,0,0.35); }
  .menu-panel h2 { font-size: 20px; margin-bottom: 28px; letter-spacing: 0.12em; font-weight: 700; }
  .menu-panel ul { list-style: none; }
  .menu-panel li { border-bottom: 1px solid rgba(255,255,255,0.08); }
  .menu-panel a { display: block; padding: 16px 0; color: #fff; text-decoration: none; font-size: 15px; }
  .menu-panel a:hover { color: #ffd166; }
  ::-webkit-scrollbar { width: 0; background: transparent; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="title">りんばむ</div>
    <div class="search-box"><input type="text" placeholder="検索…" aria-label="検索"></div>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開閉" aria-expanded="true" onclick="toggleMenu()"><span></span><span></span><span></span></button>
  </header>
  <main>
    <article class="card"><div class="card-img">ダミー画像</div><h3>カードタイトル 1</h3><p>これはダミーのカードコンテンツです。</p></article>
    <article class="card"><div class="card-img">ダミー画像</div><h3>カードタイトル 2</h3><p>選択やタグ、アーカイブ機能を利用して整理できます。</p></article>
    <article class="card"><h3>テキストのみカード</h3><p>画像を非表示にした状態のダミーカードです。</p></article>
  </main>
  <button class="ai" aria-label="AI">AI</button>
  <nav class="bottom" aria-label="メインナビゲーション">
    <a href="#" aria-label="グループ"><span class="nav-icon">◈</span>グループ</a>
    <a href="#" aria-label="エクスポート"><span class="nav-icon">⤴</span>エクスポート</a>
    <a href="#" aria-label="追加" class="active"><span class="nav-icon">+</span>＋</a>
    <a href="#" aria-label="タグ"><span class="nav-icon">#</span>タグ</a>
    <a href="#" aria-label="アーカイブ"><span class="nav-icon">◷</span>アーカイブ</a>
  </nav>
  <div class="menu-overlay" id="menuOverlay" onclick="handleOverlayClick(event)">
    <aside class="menu-panel" onclick="event.stopPropagation()">
      <h2>メニュー</h2>
      <ul>
        <li><a href="#" data-action="プロフィール">プロフィール</a></li>
        <li><a href="#" data-action="画像なし表示に切り替える">画像なし表示に切り替える</a></li>
        <li><a href="#" data-action="選択">選択</a></li>
        <li><a href="#" data-action="使い方">使い方</a></li>
        <li><a href="#" data-action="データの取り扱い">データの取り扱い</a></li>
      </ul>
    </aside>
  </div>
  <div id="feedback" role="status" style="position:absolute;bottom:75px;left:16px;right:16px;background:#1a1a2e;color:white;border-radius:12px;padding:12px;display:none;z-index:210"></div>
</div>
<script>
  const overlay = document.getElementById('menuOverlay');
  function setMenu(open) { overlay.classList.toggle('hidden', !open); overlay.setAttribute('aria-hidden', String(!open)); document.getElementById('menuBtn').setAttribute('aria-expanded', String(open)); }
  function toggleMenu() { setMenu(overlay.classList.contains('hidden')); }
  function handleOverlayClick(e) { if (e.target === overlay) setMenu(false); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  document.querySelectorAll('[data-action]').forEach(link => link.addEventListener('click', e => {
    e.preventDefault(); setMenu(false);
    const feedback = document.getElementById('feedback');
    feedback.textContent = link.dataset.action + '（デザイン確認用）';
    feedback.style.display = 'block';
    setTimeout(() => feedback.style.display = 'none', 2000);
  }));
</script>
</body>
</html>
