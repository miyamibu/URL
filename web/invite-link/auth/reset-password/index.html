<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>りんばむ パスワード再設定</title>
  <link rel="stylesheet" href="/auth/reset-password/styles.css">
</head>
<body>
  <main>
    <section>
      <h1>パスワード再設定</h1>
      <p class="muted">新しいパスワードを入力してください。</p>
      <p id="status" class="notice" role="status" aria-live="polite">再設定リンクを確認しています…</p>
      <form id="form" hidden>
        <label>
          新しいパスワード
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>
          新しいパスワード（確認）
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button id="submit" type="submit">パスワードを変更する</button>
      </form>
    </section>
  </main>

  <script defer src="/auth/reset-password/reset-password.js"></script>
</body>
</html>
