<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>りんばむ 共有タグの招待</title>
  <link rel="stylesheet" href="/invite/invite.css">
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="invite-title">
      <p class="eyebrow">りんばむ</p>
      <h1 id="invite-title">共有タグの招待</h1>
      <p id="status" class="status" role="status" aria-live="polite">招待リンクを確認しています…</p>

      <div id="invite-actions" hidden>
        <a id="open-app" class="button primary" href="#" aria-describedby="manual-help">りんばむで開く</a>
        <button id="copy-link" class="button secondary" type="button">招待リンクをコピー</button>

        <div class="stores" aria-label="公式ストアからインストール">
          <a href="https://apps.apple.com/app/id6771251450" target="_blank" rel="noopener noreferrer">App Store</a>
          <a href="https://play.google.com/store/apps/details?id=jp.miyamibu.urlalbum" target="_blank" rel="noopener noreferrer">Google Play</a>
        </div>

        <div id="manual-help" class="manual-help">
          <h2>開けないとき</h2>
          <ol>
            <li>上の公式ストアからりんばむをインストールまたは更新します。</li>
            <li>このページに戻ります。必要な場合は「招待リンクをコピー」し、同じブラウザーで開き直します。</li>
            <li>「りんばむで開く」を押し、アプリ内の参加案内に従います。</li>
          </ol>
        </div>
      </div>
    </section>
  </main>
  <script defer src="/invite/invite.js"></script>
</body>
</html>
