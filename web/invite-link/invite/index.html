<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>りんばむ 共有タグ招待</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f4f7fb; color: #102033; }
    main { max-width: 560px; margin: 0 auto; padding: 56px 22px; }
    a { color: inherit; }
    .button { display: inline-block; margin-top: 22px; padding: 14px 18px; border-radius: 16px; background: #1f6fd1; color: white; font-weight: 800; text-decoration: none; }
    .code { margin-top: 18px; padding: 12px; border: 1px solid #c5d0dd; border-radius: 16px; background: white; color: #506176; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>りんばむの共有タグに参加</h1>
    <p>アプリが自動で開かない場合は、下のボタンを押してください。</p>
    <a id="open-app" class="button" href="#">りんばむで開く</a>
    <p id="token" class="code"></p>
  </main>
  <script>
    const parts = window.location.pathname.split('/').filter(Boolean);
    const token = parts[0] === 'invite' ? parts.slice(1).join('/') : '';
    const appUrl = token ? `urlsaver://invite/${encodeURIComponent(token)}` : 'urlsaver://invite';
    const link = document.getElementById('open-app');
    link.href = appUrl;
    document.getElementById('token').textContent = token ? '参加リンクを開いています。アプリが開かない場合は、このページを開き直してください。' : '参加リンクを確認できませんでした。';
    if (token) {
      setTimeout(() => { window.location.href = appUrl; }, 250);
    }
  </script>
</body>
</html>
